<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="utilitaires/bootstrap-5.3.3-dist/css/bootstrap.min.css">

    <script src="utilitaires/bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>
    <script src="js/requetes.js"></script>

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light nav-perso">
        <a class="navbar-brand" href="#">Examen 1</a>
        <button class="navbar-toggler" type="button" donnees-toggle="collapse" donnees-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#" onClick="chargerFleurs();">[Lister]</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onClick="montrerElement('divAjouterFleur');">[Ajouter]</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onClick="montrerElement('divSupprimerFleur');">[Supprimer]</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onClick="montrerElement('divListerParCategorie');">[Lister par categorie]</a>
                </li>

                    <a class="nav-link" href="#" onClick="reqTotalPrix();">[Total]</a>
                </li>
            </ul>
        </div>
    </nav>
    <!-- Formulaire pour ajouter une fleur-->
    <div class="container mt-5">
        <div id="divAjouterFleur" class="mb-4" style="display: none;">
            <h3>Ajouter une fleur</h3>
            <form>
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" class="form-control" id="nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="categorie">Categorie</label>
                    <input type="text" class="form-control" id="categorie" name="categorie" required>
                </div>
                <div class="form-group">
                    <label for="couleur">Couleur</label>
                    <input type="text" class="form-control" id="couleur" name="couleur" required>
                </div>
                <div class="form-group">
                    <label for="prix">Prix</label>
                    <input type="number" class="form-control" id="prix" name="prix" required>
                </div>
                <button type="submit" class="btn btn-primary" onClick="reqAjouterFleur();">Sauvegarder</button>
                <button type="button" class="btn btn-secondary" onClick="cacherElement('divAjouterFleur')">Fermer</button>
            </form>
        </div>
<!-- Fin du formulaire pour ajouter une fleur -->
<!-- Formulaire pour supprimer une fleur selon l'id -->
<div id="divSupprimerFleur" class="mb-4" style="display: none;">
    <h3>Supprimer selon un id</h3>
    <form>
        <div class="form-group">
            <label for="idFleurSupp">Entrez l'id de la fleur à supprimer</label>
            <input type="number" class="form-control" id="idFleurSupp" name="idFleurSupp" required>
        </div><br />
        <button type="button" class="btn btn-primary" onClick="reqSupprimerFleur();">Rechercher</button>
        <button type="button" class="btn btn-secondary" onClick="cacherElement('divSupprimerFleur');">Fermer</button>
    </form>
</div>
<!-- Fin du formulaire pour supprimer une fleur selon l'id -->
<!-- Formulaire rechercher selon la categorie -->
<div id="divListerParCategorie" class="mb-4" style="display: none;">
    <h3>Rechercher par categorie</h3>
    <form>
        <div class="form-group">
            <label for="categorie">Entrez le categorie</label>
            <input type="text" class="form-control" id="cat" name="cat" required>
        </div><br />
        <button type="button" class="btn btn-primary" onClick="reqListerParCategorie();">Rechercher</button>
        <button type="button" class="btn btn-secondary" onClick="cacherElement('divListerParCategorie');">Fermer</button>
    </form>
</div>
<!-- Fin du formulaire rechercher selon le categorie -->

    <div id="liste-fleurs">
        <h3 id="titreListe"></h3>
        <div class="table-responsive">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Categorie</th>
                        <th>Coleur</th>
                        <th>Prix</th>
                    </tr>
                </thead>
                <tbody id="fleurs-table">
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
